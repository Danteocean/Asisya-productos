name: CI/CD Pipeline Asisya

on:
  push:
    branches: 
      - main
      - development
  pull_request:
    branches: 
      - main
      - development

jobs:
  # --- TRABAJO 1: VALIDACIÓN DEL BACKEND (.NET) ---
  backend-validation:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilación (Build)
        run: dotnet build --no-restore --configuration Release

  
  frontend-validation:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: ./Front/Asisya-web
        run: npm install

      - name: Validación de estilo (Lint)
        working-directory: ./Front/Asisya-web
        run: npm run lint || echo "No se encontró script de lint o falló, continuando..."

      - name: Compilación del Front (Build)
        working-directory: ./Front/Asisya-web
        run: npm run build

  
  docker-validation:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation] 
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar Docker Compose Build
        run: docker compose build --no-cache